<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coletor THOR</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ======================================================
     TELA INICIAL
====================================================== -->

<div id="login" class="container">

    <!-- LOGO -->
    <img
        src="logo-thor.png"
        class="logo"
        alt="THOR Natural Stones"
    >

    <h1>COLETOR</h1>


    <div class="card">

        <!-- USUÁRIO -->

        <label for="usuario">
            Usuário
        </label>

        <select id="usuario">

            <option value="">
                Carregando...
            </option>

        </select>


        <!-- INVENTÁRIO -->

        <label for="inventario">
            Inventário
        </label>

        <input
            id="inventario"
            type="text"
            placeholder="Digite o inventário"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <!-- ENDEREÇO -->

        <label for="endereco">
            Endereço
        </label>

        <input
            id="endereco"
            type="text"
            placeholder="Digite o endereço"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <!-- BOTÃO -->

        <button
            id="btnEntrar"
            type="button"
        >
            INICIAR COLETA
        </button>

    </div>

</div>



<!-- ======================================================
     TELA DE COLETA
====================================================== -->

<div
    id="coleta"
    class="container"
    style="display:none;"
>


    <!-- LOGO -->

    <img
        src="logo-thor.png"
        class="logo"
        alt="THOR Natural Stones"
    >


    <h1>COLETA</h1>


    <div class="card">


        <!-- USUÁRIO -->

        <p>
            <b>Usuário:</b>
        </p>

        <h2 id="lblUsuario"></h2>


        <!-- INVENTÁRIO -->

        <p>
            <b>Inventário:</b>
        </p>

        <h2 id="lblInventario"></h2>


        <!-- ENDEREÇO -->

        <p>
            <b>Endereço:</b>
        </p>

        <h2 id="lblEndereco"></h2>


        <hr>


        <!-- CONTADOR DO ENDEREÇO -->

        <p>
            Produtos neste endereço
        </p>

        <h1 id="contadorEndereco">
            0
        </h1>


        <!-- CONTADOR TOTAL -->

        <p>
            Total coletado
        </p>

        <h1 id="contadorTotal">
            0
        </h1>


        <hr>


        <!-- ==================================================
             ÁREA DA CÂMERA
        ================================================== -->

        <div
            id="cameraArea"
            style="display:none;"
        >

            <video
                id="camera"
                autoplay
                muted
                playsinline
            ></video>


            <div class="scanner-box">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <p class="camera-instruction">
                Aponte a câmera para o código de barras
            </p>

        </div>


        <!-- ==================================================
             DIGITAÇÃO MANUAL
        ================================================== -->

        <label for="codigo">
            Ou digite o código:
        </label>


        <input
            id="codigo"
            type="text"
            placeholder="DIGITE OU COLE O CÓDIGO"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <button
            id="btnRegistrar"
            type="button"
        >
            REGISTRAR
        </button>


        <hr>


        <!-- ÚLTIMA LEITURA -->

        <strong>
            Última leitura
        </strong>


        <h2 id="ultimaLeitura">
            -
        </h2>


    </div>

</div>



<!-- ======================================================
     CONFIGURAÇÃO
====================================================== -->

<script src="config.js"></script>


<!-- ======================================================
     SCRIPT PRINCIPAL
====================================================== -->

<script src="script.js"></script>


</body>

</html>
