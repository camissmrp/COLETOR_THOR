<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Coletor THOR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- =====================================================
             TELA INICIAL
        ====================================================== -->

        <div id="login" class="card">

            <div class="logo-area">
                <img
                    src="logo-thor.png"
                    alt="THOR Natural Stones"
                    class="logo"
                >
            </div>

            <h1>COLETA</h1>

            <label for="usuario">
                Usuário:
            </label>

            <select id="usuario">
                <option value="">
                    Carregando...
                </option>
            </select>


            <label for="inventario">
                Inventário:
            </label>

            <input
                type="text"
                id="inventario"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="Digite o inventário"
            >


            <label for="endereco">
                Endereço:
            </label>

            <input
                type="text"
                id="endereco"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="Digite o endereço"
            >


            <button
                type="button"
                id="btnEntrar"
            >
                INICIAR COLETA
            </button>

        </div>


        <!-- =====================================================
             TELA DE COLETA
        ====================================================== -->

        <div
            id="coleta"
            class="card"
            style="display:none;"
        >

            <div class="logo-area">
                <img
                    src="logo-thor.png"
                    alt="THOR Natural Stones"
                    class="logo"
                >
            </div>

            <h1>COLETA</h1>


            <!-- USUÁRIO -->

            <label>
                Usuário:
            </label>

            <h2 id="lblUsuario">
                -
            </h2>


            <!-- INVENTÁRIO -->

            <label>
                Inventário:
            </label>

            <h2 id="lblInventario">
                -
            </h2>


            <!-- ENDEREÇO -->

            <label>
                Endereço:
            </label>

            <h2 id="lblEndereco">
                -
            </h2>


            <hr>


            <!-- CONTADOR DO ENDEREÇO -->

            <p>
                Produtos neste endereço
            </p>

            <h1
                id="contadorEndereco"
                class="contador endereco"
            >
                0
            </h1>


            <!-- TOTAL -->

            <p>
                Total coletado
            </p>

            <h1
                id="contadorTotal"
                class="contador total"
            >
                0
            </h1>


            <hr>


            <!-- =================================================
                 CÂMERA
            ================================================== -->

            <div class="titulo-leitor">
                Leitura por câmera
            </div>


            <div
                id="reader"
                class="reader"
            >
            </div>


            <p class="instrucao">
                Aponte a câmera para o código de barras
            </p>


            <!-- =================================================
                 DIGITAÇÃO MANUAL
            ================================================== -->

            <div class="manual-area">

                <label for="codigoManual">
                    Ou digite o código:
                </label>


                <input
                    type="text"
                    id="codigoManual"
                    class="codigo-manual"
                    placeholder="Digite ou cole o código"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >


                <button
                    type="button"
                    id="btnRegistrarManual"
                    class="btn-registrar"
                >
                    REGISTRAR
                </button>

            </div>


            <hr>


            <!-- ÚLTIMA LEITURA -->

            <strong>
                Última leitura
            </strong>

            <h2
                id="ultimaLeitura"
                class="ultima"
            >
                -
            </h2>

        </div>

    </div>


    <!-- =====================================================
         CONFIGURAÇÃO
    ====================================================== -->

    <script src="config.js"></script>


    <!-- =====================================================
         BIBLIOTECA DO LEITOR
    ====================================================== -->

    <script
        src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>


    <!-- =====================================================
         SCRIPT DO APLICATIVO
    ====================================================== -->

    <script src="script.js"></script>


    <!-- =====================================================
         AJUSTES VISUAIS DO LEITOR
    ====================================================== -->

    <style>

        .logo-area {
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }

        .logo {
            width: 250px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
        }

        .titulo-leitor {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .reader {
            width: 100%;
            max-width: 100%;
            min-height: 260px;
            overflow: hidden;
            border-radius: 8px;
            background: #111;
        }

        .reader video {
            width: 100% !important;
            height: auto !important;
            max-width: 100% !important;
            display: block !important;
            object-fit: cover !important;
        }

        #reader__scan_region {
            width: 100% !important;
        }

        #reader__dashboard {
            display: none !important;
        }

        .instrucao {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
        }

        .manual-area {
            margin-top: 18px;
        }

        .manual-area label {
            display: block;
            margin-top: 0;
        }

        .codigo-manual {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #BDBDBD;
            font-size: 20px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .btn-registrar {
            margin-top: 10px;
            background: #A69484;
        }

        .btn-registrar:hover {
            background: #8F7D6D;
        }

        .contador {
            text-align: center;
            font-size: 48px;
            margin: 8px 0 20px 0;
        }

        .contador.endereco {
            color: #A69484;
        }

        .contador.total {
            color: #111111;
        }

        .ultima {
            text-align: center;
            color: #A69484;
            font-size: 24px;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 10px;
                box-sizing: border-box;
            }

            .card {
                width: 100%;
                max-width: 100%;
                padding: 20px;
                box-sizing: border-box;
            }

            .logo {
                width: 240px;
            }

            .reader {
                min-height: 280px;
            }

            .codigo-manual {
                font-size: 20px;
            }

            button {
                min-height: 52px;
            }

        }

    </style>

</body>

</html>
