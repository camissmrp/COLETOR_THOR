<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Coletor THOR</title>

    <link rel="stylesheet" href="style.css">

    <!-- ZXing -->
    <script src="https://unpkg.com/@zxing/browser@latest"></script>

</head>

<body>

    <div class="app">

        <!-- LOGO -->
        <div class="logo-container">
            <img src="logo-thor.png" class="logo" alt="THOR Natural Stones">
        </div>

        <h1>COLETA</h1>

        <div class="card">

            <div class="info">

                <div class="campo">
                    <span>Usuário:</span>
                    <strong id="usuario">-</strong>
                </div>

                <div class="campo">
                    <span>Inventário:</span>
                    <strong id="inventario">-</strong>
                </div>

                <div class="campo">
                    <span>Endereço:</span>
                    <strong id="endereco">-</strong>
                </div>

            </div>

            <hr>

            <div class="contador">

                <p>Produtos neste endereço</p>

                <h2 id="contadorEndereco">0</h2>

                <p>Total coletado</p>

                <h2 id="contadorTotal">0</h2>

            </div>

            <hr>

            <!-- CÂMERA -->
            <div class="camera-container">

                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline>
                </video>

                <div class="scanner-frame">

                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>

                </div>

            </div>

            <p class="camera-help">
                Aponte a câmera para o código de barras
            </p>

            <!-- DIGITAÇÃO MANUAL -->
            <div class="manual">

                <strong>Ou digite o código:</strong>

                <input
                    type="text"
                    id="codigo"
                    placeholder="DIGITE OU COLE O CÓDIGO"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false">

                <button id="btnRegistrar">
                    REGISTRAR
                </button>

            </div>

            <hr>

            <div class="ultima">

                <strong>Última leitura</strong>

                <div id="ultimaLeitura">
                    -
                </div>

            </div>

            <!-- STATUS -->
            <div id="status" class="status"></div>

        </div>

    </div>

    <!-- CONFIGURAÇÃO DA API -->
    <script src="config.js"></script>

    <!-- SISTEMA -->
    <script src="script.js"></script>

</body>

</html>
