<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#A89483"
    >

    <title>Coletor THOR</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        #modalQuantidadeLote {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,.72);
        }

        #modalQuantidadeLote .quantidade-box {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 16px;
            padding: 22px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }

        #modalQuantidadeLote .quantidade-titulo {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        #modalQuantidadeLote .quantidade-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        #codigoLoteCapturado {
            font-size: 20px;
            font-weight: 700;
            word-break: break-all;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        #quantidadeLote {
            width: 100%;
            font-size: 24px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: center;
        }

        #quantidadeLote:focus {
            outline: none;
            border-color: #A89483;
        }

        #erroQuantidadeLote {
            min-height: 20px;
            color: #c62828;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .quantidade-botoes {
            display: flex;
            gap: 10px;
        }

        .quantidade-botoes button {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        #cancelarQuantidadeLote {
            background: #ddd;
            color: #333;
        }

        #confirmarQuantidadeLote {
            background: #A89483;
            color: #fff;
        }

    </style>

</head>


<body>


<div
    id="login"
    class="screen"
>

    <div class="brand">

        <img
            src="logo-thor.png"
            alt="THOR Natural Stones"
            class="logo"
        >

        <h1>COLETA</h1>

    </div>


    <div class="card login-card">


        <label for="usuario">
            Usuário
        </label>

        <select id="usuario">

            <option value="">
                Carregando...
            </option>

        </select>


        <label for="inventario">
            Inventário
        </label>

        <input
            id="inventario"
            type="text"
            placeholder="Digite o inventário"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <label for="tipoProduto">
            Tipo de produto
        </label>

        <select id="tipoProduto">

            <option value="">
                Carregando...
            </option>

        </select>


        <label for="endereco">
            Endereço
        </label>

        <input
            id="endereco"
            type="text"
            placeholder="Digite o endereço"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <button
            id="btnEntrar"
            class="btn-primary"
            type="button"
        >
            INICIAR COLETA
        </button>


        <div
            id="loginStatus"
            class="status"
            aria-live="polite"
        ></div>


    </div>

</div>


<div
    id="coleta"
    class="screen hidden"
>


    <div class="brand collection-brand">

        <img
            src="logo-thor.png"
            alt="THOR Natural Stones"
            class="logo"
        >

        <h1>COLETA</h1>

    </div>


    <div class="card collection-card">


        <div class="session-info">

            <div>

                <span>
                    Usuário:
                </span>

                <strong id="lblUsuario">
                    -
                </strong>

            </div>


            <div>

                <span>
                    Inventário:
                </span>

                <strong id="lblInventario">
                    -
                </strong>

            </div>


            <div>

                <span>
                    Tipo de produto:
                </span>

                <strong id="lblTipoProduto">
                    -
                </strong>

            </div>


            <div>

                <span>
                    Endereço:
                </span>

                <strong id="lblEndereco">
                    -
                </strong>

            </div>

        </div>


        <button
            id="btnAlterarEndereco"
            class="btn-secondary"
            type="button"
            style="display:none;"
        >
            ALTERAR ENDEREÇO
        </button>


        <hr>


        <div class="counter-row">


            <div class="counter-box">

                <span>
                    Produtos neste endereço
                </span>

                <strong id="contadorEndereco">
                    0
                </strong>

            </div>


            <div class="counter-box">

                <span>
                    Total coletado
                </span>

                <strong id="contadorTotal">
                    0
                </strong>

            </div>


        </div>


        <hr>


        <div
            id="cameraArea"
            class="camera-area"
        >

            <div class="camera-container">


                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline
                    webkit-playsinline="true"
                    disablepictureinpicture
                    aria-label="Câmera para leitura de código de barras"
                ></video>


                <div
                    class="scanner-overlay"
                    aria-hidden="true"
                >

                    <div class="scanner-frame">

                        <span class="corner top-left"></span>

                        <span class="corner top-right"></span>

                        <span class="corner bottom-left"></span>

                        <span class="corner bottom-right"></span>

                    </div>

                </div>


                <div
                    id="cameraMessage"
                    class="camera-message"
                >
                    Preparando câmera...
                </div>


            </div>


            <p class="camera-help">
                Aponte a câmera para o código de barras
            </p>


        </div>


        <div class="manual-area">


            <label for="codigo">
                Ou digite o código:
            </label>


            <input
                id="codigo"
                type="text"
                placeholder="DIGITE OU COLE O CÓDIGO"
                autocomplete="off"
                autocapitalize="characters"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="done"
            >


            <button
                id="btnRegistrar"
                class="btn-primary"
                type="button"
            >
                REGISTRAR
            </button>


        </div>


        <div class="last-reading">

            <span>
                Última leitura
            </span>

            <strong id="ultimaLeitura">
                -
            </strong>

        </div>


        <div
            id="collectionStatus"
            class="status"
            aria-live="polite"
        ></div>


    </div>

</div>


<!-- =====================================================
     TELA DE QUANTIDADE - COLETA EM LOTE
===================================================== -->

<div
    id="modalQuantidadeLote"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tituloQuantidadeLote"
>

    <div class="quantidade-box">


        <div
            id="tituloQuantidadeLote"
            class="quantidade-titulo"
        >
            COLETA EM LOTE
        </div>


        <span class="quantidade-label">
            Código capturado
        </span>


        <div id="codigoLoteCapturado">
            -
        </div>


        <label
            for="quantidadeLote"
            class="quantidade-label"
        >
            Quantidade de peças
        </label>


        <input
            id="quantidadeLote"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Digite a quantidade"
        >


        <div
            id="erroQuantidadeLote"
            aria-live="polite"
        ></div>


        <div class="quantidade-botoes">


            <button
                id="cancelarQuantidadeLote"
                type="button"
            >
                CANCELAR
            </button>


            <button
                id="confirmarQuantidadeLote"
                type="button"
            >
                CONFIRMAR
            </button>


        </div>


    </div>

</div>


<script
    src="https://unpkg.com/@zxing/browser@0.2.1"
></script>


<script src="config.js"></script>


<script src="script.js"></script>


</body>

</html>
