<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coletor THOR</title>

    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca para leitura de código de barras -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

<!-- ============================= -->
<!-- TELA INICIAL -->
<!-- ============================= -->

<div id="login" class="container">

    <img
        src="logo-thor.png"
        alt="THOR Natural Stones"
        class="logo"
    >

    <h1>COLETOR THOR</h1>

    <div class="card">

        <label for="usuario">Usuário</label>

        <select id="usuario">
            <option>Carregando...</option>
        </select>


        <label for="inventario">Inventário</label>

        <input
            id="inventario"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Digite o inventário"
        >


        <label for="endereco">Endereço</label>

        <input
            id="endereco"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Digite o endereço"
        >


        <button id="btnEntrar">
            INICIAR COLETA
        </button>

    </div>

</div>


<!-- ============================= -->
<!-- TELA DE COLETA -->
<!-- ============================= -->

<div
    id="coleta"
    class="container"
    style="display:none;"
>

    <img
        src="logo-thor.png"
        alt="THOR Natural Stones"
        class="logo"
    >

    <h1>COLETA</h1>


    <div class="card">

        <p><b>Usuário:</b></p>
        <h2 id="lblUsuario"></h2>


        <p><b>Inventário:</b></p>
        <h2 id="lblInventario"></h2>


        <p><b>Endereço:</b></p>
        <h2 id="lblEndereco"></h2>


        <hr>


        <p>Produtos neste endereço</p>

        <h1 id="contadorEndereco">0</h1>


        <p>Total coletado</p>

        <h1 id="contadorTotal">0</h1>


        <hr>


        <!-- ============================= -->
        <!-- LEITOR DE CÓDIGO DE BARRAS -->
        <!-- ============================= -->

        <div id="leitor">

            <div id="reader"></div>

        </div>


        <p class="texto-camera">
            Aponte a câmera para o código de barras
        </p>


        <strong>Última leitura</strong>

        <h2 id="ultimaLeitura">-</h2>

    </div>

</div>


<!-- ============================= -->
<!-- SCRIPTS -->
<!-- ============================= -->

<script src="config.js"></script>

<script src="script.js"></script>

</body>

</html>
