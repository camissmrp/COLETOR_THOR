<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#A89483"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>Coletor THOR</title>


    <!-- ==================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     TELA INICIAL
===================================================== -->

<div
    id="login"
    class="screen"
>

    <!-- CABEÇALHO -->

    <div class="brand">

        <img
            src="logo-thor.png"
            alt="THOR Natural Stones"
            class="logo"
        >

        <h1>COLETA</h1>

    </div>


    <!-- CARD DE LOGIN -->

    <div class="card login-card">


        <!-- USUÁRIO -->

        <label for="usuario">
            Usuário
        </label>

        <select
            id="usuario"
        >

            <option value="">
                Carregando...
            </option>

        </select>


        <!-- INVENTÁRIO -->

        <label for="inventario">
            Inventário
        </label>

        <input
            id="inventario"
            type="text"
            placeholder="Digite o inventário"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            autocorrect="off"
            spellcheck="false"
        >


        <!-- ENDEREÇO -->

        <label for="endereco">
            Endereço
        </label>

        <input
            id="endereco"
            type="text"
            placeholder="Digite o endereço"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
        >


        <!-- =================================================
             BOTÃO INICIAR
        ================================================= -->

        <button
            id="btnEntrar"
            class="btn-primary"
            type="button"
        >
            INICIAR COLETA
        </button>


        <!-- STATUS -->

        <div
            id="loginStatus"
            class="status"
            aria-live="polite"
        ></div>


    </div>

</div>



<!-- =====================================================
     TELA DE COLETA
===================================================== -->

<div
    id="coleta"
    class="screen hidden"
>


    <!-- CABEÇALHO -->

    <div class="brand collection-brand">

        <img
            src="logo-thor.png"
            alt="THOR Natural Stones"
            class="logo"
        >

        <h1>COLETA</h1>

    </div>


    <!-- CARD DE COLETA -->

    <div class="card collection-card">


        <!-- =================================================
             INFORMAÇÕES DA SESSÃO
        ================================================= -->

        <div class="session-info">


            <!-- USUÁRIO -->

            <div>

                <span>
                    Usuário:
                </span>

                <strong id="lblUsuario">
                    -
                </strong>

            </div>


            <!-- INVENTÁRIO -->

            <div>

                <span>
                    Inventário:
                </span>

                <strong id="lblInventario">
                    -
                </strong>

            </div>


            <!-- ENDEREÇO -->

            <div>

                <span>
                    Endereço:
                </span>

                <strong id="lblEndereco">
                    -
                </strong>

            </div>


        </div>


        <hr>



        <!-- =================================================
             CONTADORES
        ================================================= -->

        <div class="counter-row">


            <!-- CONTADOR DO ENDEREÇO -->

            <div class="counter-box">

                <span>
                    Produtos neste endereço
                </span>

                <strong id="contadorEndereco">
                    0
                </strong>

            </div>


            <!-- CONTADOR TOTAL -->

            <div class="counter-box">

                <span>
                    Total coletado
                </span>

                <strong id="contadorTotal">
                    0
                </strong>

            </div>


        </div>


        <hr>



        <!-- =================================================
             CÂMERA
        ================================================= -->

        <div
            id="cameraArea"
            class="camera-area"
        >


            <div class="camera-container">


                <!-- VÍDEO DA CÂMERA -->

                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline
                    webkit-playsinline="true"
                    disablepictureinpicture
                    aria-label="Câmera para leitura de código de barras"
                ></video>


                <!-- MOLDURA DE LEITURA -->

                <div
                    class="scanner-overlay"
                    aria-hidden="true"
                >

                    <div class="scanner-frame">


                        <span
                            class="corner top-left"
                        ></span>


                        <span
                            class="corner top-right"
                        ></span>


                        <span
                            class="corner bottom-left"
                        ></span>


                        <span
                            class="corner bottom-right"
                        ></span>


                    </div>

                </div>


                <!-- MENSAGEM -->

                <div
                    id="cameraMessage"
                    class="camera-message"
                >
                    Preparando câmera...
                </div>


            </div>


            <p class="camera-help">
                Aponte a câmera para o código de barras
            </p>


        </div>



        <!-- =================================================
             DIGITAÇÃO MANUAL
        ================================================= -->

        <div class="manual-area">


            <label for="codigo">
                Ou digite o código:
            </label>


            <input
                id="codigo"
                type="text"
                placeholder="DIGITE OU COLE O CÓDIGO"
                autocomplete="off"
                autocapitalize="characters"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="done"
            >


            <!-- BOTÃO REGISTRAR -->

            <button
                id="btnRegistrar"
                class="btn-primary"
                type="button"
            >
                REGISTRAR
            </button>


        </div>



        <!-- =================================================
             ÚLTIMA LEITURA
        ================================================= -->

        <div class="last-reading">


            <span>
                Última leitura
            </span>


            <strong id="ultimaLeitura">
                -
            </strong>


        </div>



        <!-- STATUS -->

        <div
            id="collectionStatus"
            class="status"
            aria-live="polite"
        ></div>


    </div>

</div>



<!-- =====================================================
     BIBLIOTECA ZXING
===================================================== -->

<script
    src="https://unpkg.com/@zxing/browser@0.2.1"
></script>



<!-- =====================================================
     CONFIGURAÇÃO DA API
===================================================== -->

<script
    src="config.js"
></script>



<!-- =====================================================
     SCRIPT PRINCIPAL
===================================================== -->

<script
    src="script.js"
></script>


</body>

</html>
